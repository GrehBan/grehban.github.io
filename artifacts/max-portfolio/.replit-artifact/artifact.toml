kind = "web"
previewPath = "/"
title = "Max — Backend & Distributed Systems Engineer"
description = "A personal portfolio and technical blog for Max, a Python 3.10+ backend and distributed systems engineer working across async APIs, data stores, messaging, infrastructure, testing, CI/CD, and observability."
version = "1.0.0"
id = "artifacts/max-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20900

[services.development]
run = "pnpm --filter @workspace/max-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/max-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/max-portfolio/dist/public"


[services.env]
PORT = "20900"
BASE_PATH = "/"
