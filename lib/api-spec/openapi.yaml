openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cms
    description: Authenticated blog content management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cms/login:
    post:
      operationId: cmsLogin
      tags: [cms]
      summary: Sign in to the blog editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Signed-in administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cms/posts:
    get:
      operationId: cmsListBlogPosts
      tags: [cms]
      summary: List blog posts for the editor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CmsBlogPost"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: cmsCreateBlogPost
      tags: [cms]
      summary: Create a blog post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsBlogPostInput"
      responses:
        "201":
          description: Blog post committed to GitHub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsCommitResult"
        "400":
          description: Invalid post data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cms/posts/{locale}/{slug}:
    parameters:
      - name: locale
        in: path
        required: true
        schema:
          type: string
          enum: [en, ru]
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 1
          maxLength: 80
    put:
      operationId: cmsUpdateBlogPost
      tags: [cms]
      summary: Update a blog post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsBlogPostUpdate"
      responses:
        "200":
          description: Blog post update committed to GitHub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsCommitResult"
        "400":
          description: Invalid post data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Blog post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cmsDeleteBlogPost
      tags: [cms]
      summary: Delete a blog post
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Blog post deletion committed to GitHub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsCommitResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Blog post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AdminCredentials:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 256
      required: [username, password]
    CmsSession:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [token, expiresAt]
    CmsBlogPost:
      type: object
      properties:
        path:
          type: string
        locale:
          type: string
          enum: [en, ru]
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        pubDate:
          type: string
          format: date
        updatedDate:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        draft:
          type: boolean
        body:
          type: string
      required: [path, locale, slug, title, description, pubDate, tags, draft, body]
    CmsBlogPostInput:
      type: object
      properties:
        locale:
          type: string
          enum: [en, ru]
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 300
        pubDate:
          type: string
          format: date
        tags:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 40
        draft:
          type: boolean
        body:
          type: string
          maxLength: 40000
      required: [locale, slug, title, description, pubDate, tags, body]
    CmsBlogPostUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 300
        pubDate:
          type: string
          format: date
        tags:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 40
        draft:
          type: boolean
        body:
          type: string
          maxLength: 40000
      required: [title, description, pubDate, tags, body]
    CmsCommitResult:
      type: object
      properties:
        path:
          type: string
        commitSha:
          type: string
        commitUrl:
          type: string
          format: uri
      required: [path, commitSha, commitUrl]

